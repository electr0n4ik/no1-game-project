<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="1" stop-color="#1a1b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef476f"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- orbit motif -->
  <g transform="translate(190,150)">
    <circle r="86" fill="none" stroke="#3d4060" stroke-width="3" stroke-dasharray="6 10"/>
    <circle r="58" fill="none" stroke="#4a4e77" stroke-width="2" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="30" fill="#ef476f"/>
    <circle cx="0" cy="-8" r="9" fill="#fff5eb" opacity="0.9"/>
    <rect x="-7" y="-96" width="14" height="34" rx="6" fill="#ffd166" transform="rotate(25)"/>
    <rect x="70" y="42" width="14" height="34" rx="6" fill="#06d6a0" transform="rotate(115 77 59)"/>
    <rect x="-82" y="46" width="14" height="34" rx="6" fill="#118ab2" transform="rotate(-115 -75 63)"/>
  </g>

  <!-- title -->
  <text x="360" y="128" font-family="Segoe UI, Roboto, sans-serif" font-size="72" font-weight="800"
        fill="#fff5eb" letter-spacing="4">РУБИЛОВО</text>
  <rect x="364" y="152" width="330" height="8" rx="4" fill="url(#accent)"/>
  <text x="360" y="205" font-family="Segoe UI, Roboto, sans-serif" font-size="26" fill="#b8bdd4">
    Растёшь. Крутишь. Рубишь. Выживи 15 минут.
  </text>
  <text x="360" y="248" font-family="Segoe UI, Roboto, sans-serif" font-size="20" fill="#7d84a9">
    survivor × agar.io · Android · RuStore · Unity 6 LTS
  </text>
</svg>
