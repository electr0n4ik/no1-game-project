name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic-tests:
    name: Logic unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run spec-formula tests
        run: dotnet run --project tests/Logic.Tests
