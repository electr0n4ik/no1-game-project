name: release-apk

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      versionCode:
        description: 'versionCode (int)'
        required: true
        default: '1'

jobs:
  build-android:
    name: Build APK v${{ github.event.inputs.versionName }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-No1GameProject-Android
          restore-keys: |
            Library-No1GameProject-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TOTP: ${{ secrets.UNITY_TOTP }}
        with:
          targetPlatform: Android
          unityVersion: auto
          versionName: ${{ github.event.inputs.versionName }}
          androidVersionCode: ${{ github.event.inputs.versionCode }}
          androidAppBundle: false
          androidKeystoreName: userKeystore.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: Rubilovo-${{ github.event.inputs.versionName }}-android
          path: build/Android/*.apk
